name: numerical-validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python -m latent_state_lab.cli run --profile smoke --output results/ci-smoke
      - run: python scripts/verify_results.py results/ci-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-report-py${{ matrix.python-version }}
          path: results/ci-smoke
